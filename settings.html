<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - K.S SOCIAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #f0f4f9;
      color: #172b4d;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1769e0;
      color: white;
      text-align: center;
      padding: 20px;
    }

    nav {
      background: white;
      padding: 14px;
      text-align: center;
    }

    nav a {
      color: #1769e0;
      text-decoration: none;
      margin: 8px;
      font-weight: bold;
    }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }

    h2 { color: #1769e0; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #1769e0;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #667085;
    }
  </style>
</head>

<body>

<header>
  <h1>K.S SOCIAL</h1>
  <p>Edit Your Profile</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="profile.html">Profile</a>
  <a href="settings.html">Settings</a>
</nav>

<main>
  <section class="card">

    <h2>👤 Edit Profile</h2>
    <p>আপনার নাম ও নিজের পরিচিতি পরিবর্তন করুন।</p>

    <form id="profileForm">

      <label for="displayName">আপনার নাম</label>
      <input
        type="text"
        id="displayName"
        maxlength="50"
        required
        placeholder="আপনার নাম লিখুন"
      >

      <label for="bio">নিজের পরিচিতি (Bio)</label>
      <textarea
        id="bio"
        maxlength="160"
        placeholder="নিজের সম্পর্কে কিছু লিখুন"
      ></textarea>

      <button type="submit" id="saveButton">
        Save Profile
      </button>

    </form>

    <p id="message"></p>

  </section>
</main>

<footer>
  © 2026 K.S SOCIAL
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
  const form = document.getElementById("profileForm");
  const nameInput = document.getElementById("displayName");
  const bioInput = document.getElementById("bio");
  const message = document.getElementById("message");
  const saveButton = document.getElementById("saveButton");

  let currentUser = null;

  async function loadProfile() {
    try {
      const supabase = window.ksSupabase;

      if (!supabase) {
        message.textContent = "Supabase connection failed.";
        return;
      }

      const {
        data: { user },
        error
      } = await supabase.auth.getUser();

      if (error || !user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      const { data: profile, error: profileError } =
        await supabase
          .from("profiles")
          .select("display_name, bio")
          .eq("id", user.id)
          .maybeSingle();

      if (profileError) {
        message.textContent =
          "Profile loading failed. Please try again.";
        return;
      }

      nameInput.value =
        profile?.display_name ||
        user.user_metadata?.full_name ||
        user.email?.split("@")[0] ||
        "";

      bioInput.value = profile?.bio || "";

    } catch (error) {
      message.textContent = "Something went wrong.";
      console.error(error);
    }
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!currentUser) {
      message.textContent = "Please log in first.";
      return;
    }

    const displayName = nameInput.value.trim();
    const bio = bioInput.value.trim();

    if (displayName.length < 2) {
      message.textContent =
        "নাম কমপক্ষে ২ অক্ষরের হতে হবে।";
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";
    message.textContent = "";

    try {
      const supabase = window.ksSupabase;

      const { data: existingProfile, error: checkError } =
        await supabase
          .from("profiles")
          .select("id")
          .eq("id", currentUser.id)
          .maybeSingle();

      if (checkError) {
        throw checkError;
      }

      let saveResult;

      if (existingProfile) {
        saveResult = await supabase
          .from("profiles")
          .update({
            display_name: displayName,
            bio: bio
          })
          .eq("id", currentUser.id);
      } else {
        saveResult = await supabase
          .from("profiles")
          .insert({
            id: currentUser.id,
            display_name: displayName,
            bio: bio
          });
      }

      if (saveResult.error) {
        throw saveResult.error;
      }

      const { error: authError } =
        await supabase.auth.updateUser({
          data: {
            full_name: displayName
          }
        });

      if (authError) {
        message.textContent =
          "Profile saved, but name synchronization failed. Please refresh and try again.";
      } else {
        message.textContent =
          "সফলভাবে আপনার Profile সংরক্ষণ হয়েছে!";
      }

    } catch (error) {
      console.error(error);
      message.textContent =
        "Save failed. Please try again.";
    }

    saveButton.disabled = false;
    saveButton.textContent = "Save Profile";
  });

  loadProfile();
</script>

</body>
</html>
