
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - K.S SOCIAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: linear-gradient(135deg, #eaf2ff, #eee8ff);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 38px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .login-box h1 {
      text-align: center;
      color: #1769e0;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #758098;
      margin-bottom: 28px;
    }

    .login-box label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    .login-box input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3ef;
      border-radius: 9px;
      font-size: 15px;
    }

    .login-submit {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #1055bd;
    }

    .login-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .login-links a,
    .back-home,
    .recovery-link {
      color: #1769e0;
      text-decoration: none;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
    }

    .recovery-area {
      text-align: center;
      margin-top: 22px;
    }

    #recoveryMessage,
    #loginMessage {
      font-size: 14px;
      overflow-wrap: anywhere;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="login-page">
    <div class="login-box">

      <h1>K.S SOCIAL</h1>
      <p>Welcome back! Login to your account.</p>

      <form id="loginForm">

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit" class="login-submit">
          Login
        </button>

        <p id="loginMessage" role="status"></p>

      </form>

      <div class="login-links">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>

      <div class="recovery-area">
        <a href="#" id="forgotPassword" class="recovery-link">
          Owner Password ভুলে গেছ?
        </a>
        <p id="recoveryMessage" role="status"></p>
      </div>

      <a href="index.html" class="back-home">
        ← Back to Home
      </a>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const OWNER_EMAIL = "khaledhasanmd013@gmail.com";

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email")
        .value.trim();

      const password = document.getElementById("password")
        .value;

      const message = document.getElementById("loginMessage");
      const button = loginForm.querySelector(
        'button[type="submit"]'
      );

      if (!window.ksSupabase) {
        message.textContent =
          "Supabase connection পাওয়া যায়নি।";
        return;
      }

      button.disabled = true;
      message.textContent = "Login হচ্ছে...";

      try {
        const { data, error } =
          await window.ksSupabase.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

        message.textContent = "Login সফল হয়েছে।";

        window.location.href = "dashboard.html";

      } catch (error) {
        message.textContent =
          "Login সমস্যা: " + error.message;

      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("forgotPassword")
      .addEventListener("click", async function(event) {
        event.preventDefault();

        const message =
          document.getElementById("recoveryMessage");

        if (!window.ksSupabase) {
          message.textContent =
            "Supabase connection পাওয়া যায়নি।";
          return;
        }

        message.textContent =
          "Password Reset Link পাঠানোর চেষ্টা হচ্ছে...";

        try {
          const { error } =
            await window.ksSupabase.auth.resetPasswordForEmail(
              OWNER_EMAIL,
              {
                redirectTo:
                  "https://khaledhasanmd013.github.io/KS-SOCIAL/"
              }
            );

          if (error) throw error;

          message.textContent =
            "অনুরোধ সফল হয়েছে। Owner Email-এর Inbox দেখো।";

        } catch (error) {
          message.textContent =
            "সমস্যা হয়েছে: " + error.message;
        }
      });
  </script>

</body>
</html>
