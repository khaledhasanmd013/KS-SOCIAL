<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - K.S SOCIAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .register-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: linear-gradient(135deg, #eaf2ff, #eee8ff);
    }

    .register-box {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .register-box h1 {
      color: #1769e0;
      text-align: center;
      margin-bottom: 8px;
    }

    .register-box p {
      text-align: center;
      color: #758098;
      margin-bottom: 25px;
    }

    .register-box label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    .register-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3ef;
      border-radius: 9px;
      font-size: 15px;
    }

    .register-submit {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-submit:hover {
      background: #1055bd;
    }

    .register-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .register-links a {
      color: #1769e0;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      background: #edf4ff;
      color: #315b98;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="register-page">

    <div class="register-box">

      <h1>K.S SOCIAL</h1>

      <p>Create your private community account.</p>

      <form id="registerForm">

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your mobile number"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="invite">Invitation Code</label>
        <input
          type="text"
          id="invite"
          placeholder="Enter your invitation code"
          required
        >

        <label for="password">Create Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
          minlength="8"
        >

        <button type="submit" class="register-submit">
          Register
        </button>

      </form>

      <div class="notice">
        K.S SOCIAL is an invitation-only community.
        A valid invitation code is required.
      </div>

      <div class="register-links">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <div class="register-links">
        <a href="index.html">← Back to Home</a>
      </div>

    </div>

  </main>

</body>
</html>
