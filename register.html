<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - K.S SOCIAL</title>
  <meta name="description" content="Join the private K.S SOCIAL community with an invitation code.">

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
    }

    .register-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      background: linear-gradient(135deg, #eaf2ff, #eee8ff);
    }

    .register-box {
      width: 100%;
      max-width: 460px;
      background: #fff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .register-logo {
      text-align: center;
      color: #1769e0;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .register-subtitle {
      text-align: center;
      color: #758098;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .register-box label {
      display: block;
      font-weight: bold;
      color: #26344d;
      margin: 16px 0 7px;
      font-size: 14px;
    }

    .register-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3ef;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }

    .register-box input:focus {
      border-color: #1769e0;
    }

    .optional {
      color: #758098;
      font-size: 12px;
      font-weight: normal;
    }

    .register-submit {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-submit:hover {
      background: #1055bd;
    }

    .register-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .notice {
      background: #edf4ff;
      color: #315b98;
      padding: 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 18px;
    }

    .register-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #758098;
    }

    .register-links a {
      color: #1769e0;
      text-decoration: none;
      font-weight: bold;
    }

    .register-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .register-box {
        padding: 25px 20px;
      }

      .register-logo {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="register-page">

    <section class="register-box">

      <div class="register-logo">
        K.S SOCIAL
      </div>

      <p class="register-subtitle">
        Create your private community account.
      </p>

      <form id="registerForm">

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="phone">
          Mobile Number
          <span class="optional">(Optional)</span>
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your mobile number"
          autocomplete="tel"
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="invite">Invitation Code</label>
        <input
          type="text"
          id="invite"
          name="invite"
          placeholder="Enter your invitation code"
          autocomplete="off"
          required
        >

        <label for="password">Create Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button
          type="submit"
          class="register-submit"
        >
          Create Account
        </button>

      </form>

      <div class="notice">
        <strong>Private Community</strong><br>
        K.S SOCIAL is an invitation-only community.
        A valid invitation code is required to create an account.
        Please verify your email after registration.
      </div>

      <div class="register-links">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <div class="register-links">
        <a href="index.html">← Back to Home</a>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="register.js"></script>

</body>
</html>
