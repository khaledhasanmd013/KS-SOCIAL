
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - K.S SOCIAL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile {
      max-width: 800px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 12px #00000015;
    }
    .avatar {
      width: 110px;
      height: 110px;
      margin: auto;
      border-radius: 50%;
      background: #dceaff;
      display: grid;
      place-items: center;
      font-size: 48px;
    }
    .profile h1 { color: #1769e0; }
    .profile p { color: #555; }
    .profile-actions { margin: 20px 0; }
    .profile-actions a {
      display: inline-block;
      margin: 5px;
      padding: 10px 18px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
    .post-box {
      margin-top: 25px;
      padding: 20px;
      background: #f2f6fc;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h2>K.S SOCIAL</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact Admin</a>
    </nav>
  </header>

  <main class="profile">
    <div class="avatar">👤</div>

    <h1>Your Name</h1>
    <p>Welcome to my K.S SOCIAL profile!</p>
    <p>Friends: 0</p>

    <div class="profile-actions">
      <a href="#">Edit Profile</a>
      <a href="index.html">Home</a>
    </div>

    <div class="post-box">
      <h2>My Posts</h2>
      <p>No posts yet.</p>
    </div>
  </main>

</body>
</html>
