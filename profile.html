<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - K.S SOCIAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .profile {
      max-width: 800px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 12px #00000015;
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: auto;
      border-radius: 50%;
      background: #dceaff;
      display: grid;
      place-items: center;
      font-size: 48px;
    }

    .profile h1 { color: #1769e0; }
    .profile p { color: #555; }

    .profile-actions { margin: 20px 0; }

    .profile-actions a {
      display: inline-block;
      margin: 5px;
      padding: 10px 18px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    .post-box {
      margin-top: 25px;
      padding: 20px;
      background: #f2f6fc;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h2>K.S SOCIAL</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="contact.html">Contact Admin</a>
    </nav>
  </header>

  <main class="profile">
    <div class="avatar">👤</div>

    <h1 id="profileName">Loading...</h1>
    <p id="profileEmail">Loading profile...</p>
    <p>Friends: 0</p>

    <div class="profile-actions">
      <a href="settings.html">Edit Profile</a>
      <a href="dashboard.html">Dashboard</a>
    </div>

    <div class="post-box">
      <h2>My Posts</h2>
      <p>No posts yet.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    async function loadProfile() {
      const nameElement = document.getElementById("profileName");
      const emailElement = document.getElementById("profileEmail");

      try {
        const supabase = window.ksSupabase;

        if (!supabase) {
          nameElement.textContent = "Connection error";
          emailElement.textContent = "Supabase is not configured.";
          return;
        }

        const { data: { user }, error } =
          await supabase.auth.getUser();

        if (error || !user) {
          window.location.href = "login.html";
          return;
        }

        const name =
          user.user_metadata?.full_name ||
          user.user_metadata?.name ||
          user.email?.split("@")[0] ||
          "K.S SOCIAL User";

        nameElement.textContent = name;
        emailElement.textContent = user.email || "";

      } catch (error) {
        nameElement.textContent = "Profile could not load";
        emailElement.textContent = "Please refresh the page.";
      }
    }

    loadProfile();
  </script>

</body>
</html>
